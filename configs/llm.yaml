similarity_weights: {jaccard: 0.4, path: 0.3, same_root_change: 0.2, embed: 0.1}
embedding_model: sentence-transformers/all-MiniLM-L6-v2
prompt:
  top_log_lines: 20
  use_prompt_caching: true
pricing_usd_per_mtok:   # TODO fill from the public API pricing page; record date
  small: {input: null, output: null}
  large: {input: null, output: null}
pricing_date: null
