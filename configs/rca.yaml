seed: 0
windows:
  pre_s: 600          # W  (pre-window)
  post_s: 300         # W' (post-window)
  change_lookback_s: 900   # L
base:
  scorer: baro        # robust median/IQR z
m1:
  enabled: true
  tau_s: 300          # temporal decay, tune on dev
  alpha: 0.01
  delta0: 3.0         # sigmoid centre, tune on dev
  lam: 1.0            # service boost weight
  neighbour_hops: 1
  test: its_hac       # its_hac | mannwhitney
m2:
  enabled: true
  method: pc          # pc | granger
  topk_metrics_per_service: 3
  alpha: 0.05
  granger_maxlag: 3
  topology_constrained: true
  pagerank_damping: 0.85
m3:
  enabled: true
  ridge_lambda: 0.01
  shapley_topk: 5
  calibration: temperature   # temperature | isotonic
  abstain_threshold: 0.4
combine:            # grid-searched on dev split
  alpha: 0.5
  beta: 0.3
  gamma: 0.2
